    <meta charset="UTF-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Hind:wght@400;500;600&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .card {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: radial-gradient(120% 140% at 12% 0%, #1f5596 0%, #184784 42%, #102f57 100%);
        padding: 5.6vh 8vw 5.2vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: "Hind", "Segoe UI", sans-serif;
      }
      .card::after {
        content: "";
        position: absolute;
        right: -13vw;
        bottom: -32vh;
        width: 47vw;
        height: 89vh;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(68, 186, 163, 0.26) 0%, rgba(68, 186, 163, 0) 70%);
      }
      .logo {
        width: 30vw;
        height: auto;
        position: relative;
        z-index: 2;
      }
      .body {
        position: relative;
        z-index: 2;
      }
      .rule {
        width: 7vw;
        height: 0.8vh;
        background: #44baa3;
        border-radius: 3px;
        margin-bottom: 5vh;
      }
      h1 {
        font-family: "Merriweather", Georgia, serif;
        font-weight: 700;
        font-size: 6.6vw;
        line-height: 1.06;
        color: #ffffff;
        letter-spacing: -0.5px;
      }
      h1 .accent {
        color: #44baa3;
      }
      .sub {
        margin-top: 4.4vh;
        font-size: 2.75vw;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.82);
        letter-spacing: 0.2px;
      }
      .footer {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .url {
        font-size: 2.25vw;
        font-weight: 600;
        color: #44baa3;
        letter-spacing: 0.4px;
      }
      .who {
        font-size: 2vw;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
